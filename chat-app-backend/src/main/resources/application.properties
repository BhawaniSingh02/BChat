spring.application.name=chat-app-backend
spring.profiles.active=${APP_PROFILE:dev}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/chatapp}
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT cookie settings
# cookie.secure must be true in production (HTTPS). Set via env var or application-prod.properties.
cookie.secure=${COOKIE_SECURE:false}

# Web Push (VAPID) — leave blank to disable background push notifications.
# Generate a key pair once (e.g. `npx web-push generate-vapid-keys`) and set:
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT (a mailto: or https: URL)
vapid.public-key=${VAPID_PUBLIC_KEY:}
vapid.private-key=${VAPID_PRIVATE_KEY:}
vapid.subject=${VAPID_SUBJECT:mailto:admin@baaat.app}
